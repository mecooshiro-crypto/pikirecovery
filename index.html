<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Piki Recovery · Fútbol VR 360</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Piki Recovery: experiencia inmersiva 360° / VR de recuperación post-partido de fútbol. Recuperación física, nutricional y vuelta a la calma.">
<meta name="theme-color" content="#050b16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-v1.6.0.min.js"></script>
<script>window.AFRAME || document.write('<script src="lib/aframe-v1.6.0.min.js"><\/script>');</script>
<style>
  :root { --teal:#19e3b1; --bg:#050b16; --text:#eaf2fb; --muted:#9fb3c8; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; font-family:Montserrat, system-ui, sans-serif; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #brand { position:absolute; top:14px; left:16px; display:flex; align-items:center; gap:10px; color:var(--text);
           font-weight:800; letter-spacing:.08em; font-size:13px; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  #brand .dot { width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #7dffd9, var(--teal) 55%, #0a7f66);
                display:grid; place-items:center; color:#04131f; font-weight:900; font-size:14px; box-shadow:0 0 14px rgba(25,227,177,.6); }
  #brand small { display:block; font-weight:600; letter-spacing:.04em; color:var(--muted); font-size:11px; }
  #hint { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); max-width:min(92vw,720px); text-align:center;
          color:var(--text); font-size:13px; font-weight:600; background:rgba(5,11,22,.66); border:1px solid rgba(255,255,255,.14);
          padding:9px 16px; border-radius:999px; backdrop-filter:blur(6px); transition:opacity .4s; }
  #controls { position:absolute; top:12px; right:14px; display:flex; gap:8px; pointer-events:auto; }
  #controls button { background:rgba(5,11,22,.7); color:var(--text); border:1px solid rgba(255,255,255,.2); border-radius:999px;
          font:700 12px Montserrat, sans-serif; padding:8px 13px; cursor:pointer; }
  #controls button:hover { border-color:var(--teal); }
  #loader { position:fixed; inset:0; z-index:20; background:radial-gradient(ellipse at center, #0b1d33 0%, #050b16 70%);
            display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text); gap:18px; transition:opacity .8s; }
  #loader .ring { width:54px; height:54px; border-radius:50%; border:4px solid rgba(25,227,177,.2); border-top-color:var(--teal); animation:spin 1s linear infinite; }
  #loader h1 { margin:0; font-weight:900; letter-spacing:.12em; font-size:22px; }
  #loader p { margin:0; color:var(--muted); font-size:13px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .a-enter-vr-button, .a-enter-ar-button { z-index:15; }

<body>
<div id="loader"><div class="ring"></div><h1>PIKI RECOVERY</h1><p>Preparando el estadio…</p></div>
<div id="hud">
  <div id="brand"><div class="dot">P</div><div>PIKI RECOVERY<small>Fútbol · El trabajo invisible</small></div></div>
  <div id="controls"><button id="btnMute" title="Silenciar (M)">🔊 Sonido</button><button id="btnRecenter" title="Recentrar (R)">⟲ Recentrar</button></div>
  <div id="hint">Arrastrá para mirar en 360° · Clic para seleccionar</div>
</div>

<a-scene id="scene"
  renderer="antialias: true; colorManagement: true; maxCanvasWidth: 2048; maxCanvasHeight: 2048; foveationLevel: 0.5"
  light="defaultLightsEnabled: false"
  loading-screen="enabled: false"
  vr-mode-ui="enabled: true"
  device-orientation-permission-ui="enabled: true"
  webxr="optionalFeatures: local-floor, bounded-floor"
  cursor="rayOrigin: mouse; fuse: false"
  raycaster="objects: .clickable; far: 40"
  piki-game>
  <a-entity id="rig" position="0 0 0">
    <a-entity id="cam" camera="fov: 75; near: 0.05; far: 900" position="0 1.6 0"
              look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true"
              wasd-controls="enabled: false">
      <a-entity id="gaze" visible="false" position="0 0 -0.9"
                cursor="fuse: true; fuseTimeout: 1300; rayOrigin: entity"
                raycaster="objects: .clickable; far: 40; enabled: false"
                geometry="primitive: ring; radiusInner: 0.011; radiusOuter: 0.019"
                material="shader: flat; color: #19e3b1; opacity: 0.95; transparent: true; depthTest: false"
                animation__fuse="property: scale; startEvents: fusing; easing: linear; dur: 1300; from: 1.8 1.8 1.8; to: 0.55 0.55 0.55"
                animation__reset="property: scale; startEvents: mouseleave, click; dur: 150; to: 1 1 1"></a-entity>
    </a-entity>
    <a-entity id="handL" laser-controls="hand: left" raycaster="objects: .clickable; far: 40; lineColor: #19e3b1; lineOpacity: 0.7"></a-entity>
    <a-entity id="handR" laser-controls="hand: right" raycaster="objects: .clickable; far: 40; lineColor: #19e3b1; lineOpacity: 0.7"></a-entity>
  </a-entity>
  <a-entity id="ui"></a-entity>
</a-scene>

<script>
(() => {
'use strict';
/* =====================================================================
   PIKI RECOVERY · FÚTBOL — Experiencia VR / 360°
   Recorrido: Inicio → Elección de deporte → Cancha (final del partido)
   → Etapa 1 Recuperación física → Etapa 2 Recuperación nutricional
   → Etapa 3 Vuelta a la calma → Recuperación completada
   ===================================================================== */
const THREE = AFRAME.THREE;
const $ = s => document.querySelector(s);

/* ----------------------------- Utilidades ----------------------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmt1 = v => v.toFixed(1).replace('.', ',');
const ease = {
  inOut: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  lin: t => t,
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
const wait = ms => new Promise(r => setTimeout(r, ms));

/* Motor de tweens y "tickers" (funciona dentro y fuera de VR porque lo mueve el tick de A-Frame) */
const tweens = [];
function tween(ms, fn, easing = ease.inOut) {
  return new Promise(res => tweens.push({ t: 0, d: Math.max(1, ms), fn, easing, res }));
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt;
    const k = Math.min(1, tw.t / tw.d);
    try { tw.fn(tw.easing(k)); } catch (e) { console.error(e); }
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}
const tickers = new Set();

/* ------------------------------ Paleta ------------------------------ */
const C = {
  teal: '#19e3b1', cyan: '#39d5ff', orange: '#ff8a3d', yellow: '#ffd93d', red: '#ff4d5e',
  green: '#3ddc97', purple: '#b388ff', blue: '#4fc3ff', text: '#eaf2fb', muted: '#9fb3c8', dim: '#6f8396',
};
const FONT = "Montserrat, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
const EMOJI = "'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Segoe UI Symbol', sans-serif";
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

/* ------------------------- Helpers de canvas 2D ------------------------- */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function setFont(ctx, size, weight = 600, family = FONT, italic = false) { ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${family}`; }
function txt(ctx, s, x, y, o = {}) {
  const { size = 28, weight = 600, color = C.text, align = 'left', base = 'alphabetic', ls = 0, maxW, family = FONT, italic = false, shadow } = o;
  setFont(ctx, size, weight, family, italic); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  const hasLS = 'letterSpacing' in ctx; if (hasLS) ctx.letterSpacing = ls + 'px';
  if (shadow) { ctx.shadowColor = shadow; ctx.shadowBlur = 18; }
  if (maxW) ctx.fillText(s, x, y, maxW); else ctx.fillText(s, x, y);
  ctx.shadowBlur = 0; if (hasLS) ctx.letterSpacing = '0px';
}
function wrap(ctx, text, x, y, maxW, lh, o = {}) {
  const { size = 26, weight = 500, color = C.text, align = 'left', italic = false } = o;
  setFont(ctx, size, weight, FONT, italic); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  const words = text.split(' '); let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = w; } else line = test;
  }
  if (line) { ctx.fillText(line, x, y); y += lh; }
  return y;
}
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function panelBg(ctx, W, H, accent = C.teal, alpha = .9) {
  const p = 4, r = 34;
  ctx.save();
  rr(ctx, p, p, W - 2 * p, H - 2 * p, r);
  const g = ctx.createLinearGradient(0, 0, W * .4, H);
  g.addColorStop(0, `rgba(13,30,50,${alpha})`); g.addColorStop(1, `rgba(4,10,20,${alpha})`);
  ctx.fillStyle = g; ctx.fill(); ctx.clip();
  const gg = ctx.createRadialGradient(W * .12, 0, 0, W * .12, 0, W * .7);
  gg.addColorStop(0, hexA(accent, .2)); gg.addColorStop(1, hexA(accent, 0));
  ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = accent; ctx.fillRect(0, 0, W, 7);
  ctx.restore();
  rr(ctx, p, p, W - 2 * p, H - 2 * p, r); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.stroke();
}
function chip(ctx, x, y, label, color, o = {}) {
  const { size = 19, padX = 16, h = 38, fill = hexA(color, .16), textColor = color, weight = 700 } = o;
  setFont(ctx, size, weight); const w = ctx.measureText(label).width + padX * 2;
  rr(ctx, x, y, w, h, h / 2); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = hexA(color, .55); ctx.lineWidth = 2; ctx.stroke();
  txt(ctx, label, x + padX, y + h / 2 + size * .36, { size, weight, color: textColor });
  return w;
}
function stepper(ctx, x, y, w, cur, accent = C.teal) {
  const L = ['Física', 'Nutrición', 'Calma']; const st = w / 3;
  for (let i = 0; i < 3; i++) {
    const cx = x + st * i + st / 2;
    if (i < 2) { ctx.strokeStyle = i < cur ? C.teal : 'rgba(255,255,255,.18)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx + 20, y); ctx.lineTo(cx + st - 20, y); ctx.stroke(); }
    const done = i < cur, now = i === cur;
    circle(ctx, cx, y, 15);
    if (done) { ctx.fillStyle = C.teal; ctx.fill(); iconCheck(ctx, cx, y, 8, '#04131f', 3.2); }
    else if (now) { ctx.fillStyle = hexA(accent, .25); ctx.fill(); ctx.strokeStyle = accent; ctx.lineWidth = 3; ctx.stroke(); txt(ctx, String(i + 1), cx, y + 6, { size: 16, weight: 800, align: 'center' }); }
    else { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.stroke(); txt(ctx, String(i + 1), cx, y + 6, { size: 15, weight: 700, color: C.dim, align: 'center' }); }
    txt(ctx, L[i], cx, y + 38, { size: 16, weight: 700, color: done || now ? C.text : C.dim, align: 'center' });
  }
}
function progressBar(ctx, x, y, w, h, k, color) {
  rr(ctx, x, y, w, h, h / 2); ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fill();
  if (k > 0) { rr(ctx, x, y, Math.max(h, w * k), h, h / 2); const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, hexA(color, .7)); g.addColorStop(1, color); ctx.fillStyle = g; ctx.fill(); }
}

/* ------------------------------ Íconos vectoriales ------------------------------ */
function iconCheck(ctx, cx, cy, r, color, lw = 4) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx - r * .3, cy + r * .7); ctx.lineTo(cx + r, cy - r * .7); ctx.stroke();
}
function iconCross(ctx, cx, cy, r, color, lw = 4) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r); ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r); ctx.stroke();
}
function iconSnow(ctx, cx, cy, r, color) {
  ctx.strokeStyle = color; ctx.lineWidth = r * .13; ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3, ex = cx + Math.cos(a) * r, ey = cy + Math.sin(a) * r;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
    const bx = cx + Math.cos(a) * r * .6, by = cy + Math.sin(a) * r * .6;
    for (const s of [-1, 1]) { const b = a + s * .7; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(b) * r * .3, by + Math.sin(b) * r * .3); ctx.stroke(); }
  }
  circle(ctx, cx, cy, r * .14); ctx.fillStyle = color; ctx.fill();
}
function iconFlame(ctx, cx, cy, r, color) {
  const path = (s, oy) => {
    ctx.beginPath(); ctx.moveTo(cx, cy - r * s + oy);
    ctx.bezierCurveTo(cx + r * .95 * s, cy - r * .15 * s + oy, cx + r * .85 * s, cy + r * .95 * s + oy, cx, cy + r * s + oy);
    ctx.bezierCurveTo(cx - r * .85 * s, cy + r * .95 * s + oy, cx - r * .95 * s, cy - r * .05 * s + oy, cx - r * .3 * s, cy - r * .45 * s + oy);
    ctx.bezierCurveTo(cx - r * .2 * s, cy - r * .1 * s + oy, cx - r * .05 * s, cy - r * .35 * s + oy, cx, cy - r * s + oy);
  };
  path(1, 0); const g = ctx.createLinearGradient(0, cy - r, 0, cy + r); g.addColorStop(0, '#ffd93d'); g.addColorStop(1, color); ctx.fillStyle = g; ctx.fill();
  path(.5, r * .42); ctx.fillStyle = '#fff3b0'; ctx.fill();
}
function iconHands(ctx, cx, cy, r, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineCap = 'round';
  rr(ctx, -r * .5, -r * .1, r, r * .8, r * .28); ctx.fill();
  const fx = [-.38, -.13, .12, .37], fl = [.55, .7, .68, .52];
  fx.forEach((x, i) => { ctx.lineWidth = r * .22; ctx.beginPath(); ctx.moveTo(x * r, 0); ctx.lineTo(x * r, -fl[i] * r); ctx.stroke(); });
  ctx.lineWidth = r * .22; ctx.beginPath(); ctx.moveTo(-r * .45, r * .35); ctx.lineTo(-r * .85, r * .02); ctx.stroke();
  ctx.lineWidth = r * .08; ctx.globalAlpha = .7;
  for (const s of [1.05, 1.3]) { ctx.beginPath(); ctx.arc(0, r * .2, r * s, -Math.PI * .15, Math.PI * .15); ctx.stroke(); ctx.beginPath(); ctx.arc(0, r * .2, r * s, Math.PI * .85, Math.PI * 1.15); ctx.stroke(); }
  ctx.restore();
}
function iconDrop(ctx, cx, cy, r, color) {
  ctx.beginPath(); ctx.moveTo(cx, cy - r);
  ctx.bezierCurveTo(cx + r * .2, cy - r * .5, cx + r * .72, cy - r * .05, cx + r * .72, cy + r * .3);
  ctx.arc(cx, cy + r * .3, r * .72, 0, Math.PI);
  ctx.bezierCurveTo(cx - r * .72, cy - r * .05, cx - r * .2, cy - r * .5, cx, cy - r);
  ctx.fillStyle = color; ctx.fill();
}
function iconBolt(ctx, cx, cy, r, color) {
  ctx.beginPath(); ctx.moveTo(cx + r * .2, cy - r); ctx.lineTo(cx - r * .55, cy + r * .15); ctx.lineTo(cx - r * .02, cy + r * .15);
  ctx.lineTo(cx - r * .2, cy + r); ctx.lineTo(cx + r * .55, cy - r * .18); ctx.lineTo(cx + r * .02, cy - r * .18); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
}
function iconDumbbell(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  rr(ctx, cx - r * .6, cy - r * .1, r * 1.2, r * .2, r * .08); ctx.fill();
  for (const s of [-1, 1]) { rr(ctx, cx + s * r * .62 - r * .13, cy - r * .55, r * .26, r * 1.1, r * .1); ctx.fill(); rr(ctx, cx + s * r * .9 - r * .1, cy - r * .35, r * .2, r * .7, r * .08); ctx.fill(); }
}
function iconHeart(ctx, cx, cy, r, color) {
  ctx.beginPath(); ctx.moveTo(cx, cy + r * .8);
  ctx.bezierCurveTo(cx - r * 1.3, cy - r * .1, cx - r * .6, cy - r * 1.1, cx, cy - r * .35);
  ctx.bezierCurveTo(cx + r * .6, cy - r * 1.1, cx + r * 1.3, cy - r * .1, cx, cy + r * .8);
  ctx.fillStyle = color; ctx.fill();
}
function iconBreath(ctx, cx, cy, r, color) {
  ctx.strokeStyle = color; ctx.lineWidth = r * .14; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const y = cy - r * .5 + i * r * .5; ctx.beginPath();
    for (let x = -r; x <= r; x += 2) { const yy = y + Math.sin((x / r) * Math.PI * 1.5 + i) * r * .15; x === -r ? ctx.moveTo(cx + x, yy) : ctx.lineTo(cx + x, yy); }
    ctx.stroke();
  }
}
function iconBody(ctx, cx, cy, r, color) {
  ctx.fillStyle = color; circle(ctx, cx, cy - r * .72, r * .24); ctx.fill();
  rr(ctx, cx - r * .32, cy - r * .42, r * .64, r * .72, r * .18); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = r * .2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - r * .16, cy + r * .3); ctx.lineTo(cx - r * .22, cy + r); ctx.moveTo(cx + r * .16, cy + r * .3); ctx.lineTo(cx + r * .22, cy + r); ctx.stroke();
}
function iconBall(ctx, cx, cy, r) {
  const g = ctx.createRadialGradient(cx - r * .35, cy - r * .35, r * .1, cx, cy, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9d3dd');
  circle(ctx, cx, cy, r); ctx.fillStyle = g; ctx.fill();
  ctx.save(); circle(ctx, cx, cy, r); ctx.clip(); ctx.fillStyle = '#10151c';
  const pent = (px, py, pr, rot) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = rot + i * Math.PI * 2 / 5; ctx.lineTo(px + Math.cos(a) * pr, py + Math.sin(a) * pr); } ctx.closePath(); ctx.fill(); };
  pent(cx, cy, r * .3, -Math.PI / 2);
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; pent(cx + Math.cos(a) * r * .88, cy + Math.sin(a) * r * .88, r * .26, a + Math.PI / 5); }
  ctx.strokeStyle = '#10151c'; ctx.lineWidth = r * .04;
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r * .3, cy + Math.sin(a) * r * .3); ctx.lineTo(cx + Math.cos(a) * r * .64, cy + Math.sin(a) * r * .64); ctx.stroke(); }
  ctx.restore();
  circle(ctx, cx, cy, r); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.stroke();
}
function iconStar(ctx, cx, cy, r, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r; ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); }
  ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2.5; ctx.stroke(); }
}
function iconLock(ctx, cx, cy, r, color) {
  ctx.strokeStyle = color; ctx.lineWidth = r * .18; ctx.beginPath(); ctx.arc(cx, cy - r * .2, r * .45, Math.PI, 0); ctx.stroke();
  rr(ctx, cx - r * .65, cy - r * .2, r * 1.3, r * 1.0, r * .18); ctx.fillStyle = color; ctx.fill();
}

/* ------------------------- Texturas compartidas ------------------------- */
function canvasTex(cv, repeat) {
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;

function treatmentFX(body, kind) {
  const holder = new THREE.Group(); body.markerG.add(holder);
  const color = kind === 'frio' ? 0x7fd8ff : kind === 'calor' ? 0xff8a3d : 0x3ddc97;
  const n = 46, pos = new Float32Array(n * 3), data = [];
  for (let i = 0; i < n; i++) data.push({ x: rand(-.2, .2), y: rand(-.2, .3), z: rand(-.2, .2), v: rand(.1, .35), a: rand(0, 6) });
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size: kind === 'frio' ? .03 : .025, map: dotTex, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending }));
  pts.renderOrder = 32; holder.add(pts);
  let pack = null; const rings = [];

    pack = new THREE.Mesh(new THREE.BoxGeometry(.2, .14, .05), new THREE.MeshStandardMaterial({ color: kind === 'frio' ? 0xbfefff : 0xff9b5a, emissive: kind === 'frio' ? 0x1a6a8a : 0x8a2a00, transparent: true, opacity: .85, depthTest: false }));
    pack.renderOrder = 33; pack.position.set(0, 0, .45); holder.add(pack);
  } else {
    for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(.08, .008, 6, 40), new THREE.MeshBasicMaterial({ color, transparent: true, depthTest: false })); r.renderOrder = 33; holder.add(r); rings.push(r); }
  }
  const glow = glowSprite(color, .2, .8); glow.material.depthTest = false; glow.renderOrder = 28; holder.add(glow);

    t += dt;
    data.forEach((d, i) => {
      if (kind === 'frio') { d.y -= d.v * dt * .6; if (d.y < -.25) d.y = .3; pos[i * 3] = d.x + Math.sin(t * 2 + d.a) * .03; pos[i * 3 + 1] = d.y; pos[i * 3 + 2] = d.z; }
      else if (kind === 'calor') { d.y += d.v * dt; if (d.y > .45) d.y = -.1; pos[i * 3] = d.x * (1 - d.y); pos[i * 3 + 1] = d.y; pos[i * 3 + 2] = d.z * (1 - d.y); }
      else { const a = d.a + t * 2.2; const r = .12 + ((t * .5 + i / n) % 1) * .22; pos[i * 3] = Math.cos(a) * r; pos[i * 3 + 1] = d.y * .4; pos[i * 3 + 2] = Math.sin(a) * r; }
    });
    geo.attributes.position.needsUpdate = true;
    if (pack) pack.position.z = lerp(pack.position.z, .1, 1 - Math.exp(-dt * 3));

    glow.scale.setScalar(.25 + Math.sin(t * 3) * .05 + Math.min(t, 3) * .08);
  };
  return { step, dispose() { body.markerG.remove(holder); disposeObj(holder); } };
}

function makeSituation(key, type, m) {

      const k = inhale ? ease.sine(ph / IN) : 1 - ease.sine((ph - IN) / OUT);
      const sc = lerp(.32, .74, k); orbG.scale.setScalar(sc);
      tmp.copy(c2).lerp(c1, k); coreM.color.copy(tmp); tmp.copy(g2).lerp(g1, k); shellM.color.copy(tmp); glow.material.color.copy(tmp);
      glow.scale.setScalar(2.6 + k * 1.2); halo.material.opacity = .15 + k * .2;
      pd.forEach((d, i) => { d.th += dt * d.s * .4; const r = d.r * (inhale ? lerp(1.25, 1, ph / IN) : lerp(1, 1.25, (ph - IN) / OUT)); pp[i * 3] = Math.sin(d.ph) * Math.cos(d.th) * r; pp[i * 3 + 1] = Math.cos(d.ph) * r; pp[i * 3 + 2] = Math.sin(d.ph) * Math.sin(d.th) * r; });
      pgeo.attributes.position.needsUpdate = true;
      const phStart = inhale ? ph : ph - IN; if (phStart > .6) { S.samples++; if (Input.holding === inhale) S.match++; }
      S.hr = lerp(104, 64, ease.out(t / TOTAL)) + Math.sin(time * 1.3) * 1.2;
      infoT -= dt;
      if (infoT <= 0) {
        infoT = .12; const secs = Math.ceil(inhale ? IN - ph : IN + OUT - ph);
        label.redraw({ word: inhale ? 'INHALÁ' : 'EXHALÁ', col: inhale ? C.teal : C.purple, sec: `${secs}` });
        const sync = Input.used && S.samples > 0 ? `Sincronía ${Math.round(S.match / S.samples * 100)}%` : 'Modo guiado';
        info.redraw({ cycle: cyc, sync, hr: S.hr });
      }
      applyLight(LIGHT.calm, Object.assign({}, LIGHT.calm, { flood: .06, hemi: .32 }), t / TOTAL);
      if (S.t >= TOTAL) res();
    }, scr);
  });
  Sound.padLevel(.32, 60);
  await finished;
  if (!scr.parentNode) return;
  G.calm = { cycles: CYCLES, guided: !Input.used, sync: S.samples ? Math.round(S.match / S.samples * 100) : 0, hr: Math.round(S.hr), done: true };
  info.redraw({ cycle: CYCLES, sync: G.calm.guided ? 'Modo guiado' : `Sincronía ${G.calm.sync}%`, hr: S.hr });
  label.redraw({ word: 'MUY BIEN', col: '#ffffff', sec: 'Tu respiración y tu pulso volvieron a la calma' });
  await tween(2200, k => { orbG.scale.setScalar(lerp(.32, .001, k)); orbG.position.y = 1.55 + k * .6; }, ease.in);
  await wait(800);
  vanish(label, 800); vanish(info, 800);
  // el entorno vuelve progresivamente a la cancha, ahora completamente tranquila
  setHint('');
  const skyFrom = ENV.sky.cur;
  await tween(5200, k => { ENV.sky.blend(skyFrom, SKY.dawn, k); applyLight(Object.assign({}, LIGHT.calm, { flood: .06, hemi: .32 }), LIGHT.dawn, k); }, ease.inOut);
  ENV.stadium.mode('done');
  showFinal();
}

/* ---------- 6. Final ---------- */
function showFinal() {
  const scr = makeScreen();
  Sound.finalChord(); Sound.padLevel(.4, 3);
  setHint('Recuperación completada · Podés volver a jugar con nuevas situaciones');
  const P = G.phys || { sits: [], firstTry: 0 }, N = G.nutri || { score: 0, stars: 1, good: 0 }, K = G.calm || { cycles: 6, guided: true, hr: 64 };
  const rows = [
    ['Recuperación física', `${P.sits.length} situaciones resueltas · ${P.firstTry}/3 a la primera · ${[...new Set(P.sits.map(s => TREAT[s.correct].label.toLowerCase()))].join(', ')}`, C.red],
    ['Recuperación nutricional', `Equilibrio ${N.score}% · ${'★'.repeat(N.stars)}${'☆'.repeat(3 - N.stars)} · ${N.good} elecciones prioritarias`, C.yellow],
    ['Vuelta a la calma', `${K.cycles} ciclos de respiración · ${K.guided ? 'modo guiado' : 'sincronía ' + K.sync + '%'} · FC ${K.hr} lpm`, C.purple],
  ];
  const panel = canvasPlane(2.7, 1.78, (c, W, H) => {
    panelBg(c, W, H, C.green);
    txt(c, 'PIKI RECOVERY · FÚTBOL', 56, 64, { size: 19, weight: 800, color: C.green, ls: 4 });
    stepper(c, W - 420, 60, 380, 3, C.green);
    circle(c, 100, 158, 42); c.fillStyle = C.green; c.fill(); iconCheck(c, 100, 158, 20, '#04131f', 8);
    txt(c, 'RECUPERACIÓN COMPLETADA', 164, 178, { size: 56, weight: 900 });
    txt(c, 'Terminaste el trabajo invisible. Tu cuerpo está listo para volver a entrenar.', 58, 244, { size: 23, weight: 600, color: C.teal });
    rows.forEach(([name, det, col], i) => {
      const y = 276 + i * 100;
      rr(c, 56, y, W - 112, 86, 18); c.fillStyle = 'rgba(255,255,255,.05)'; c.fill(); c.strokeStyle = hexA(col, .4); c.lineWidth = 2; c.stroke();
      c.save(); c.shadowColor = C.green; c.shadowBlur = 16; circle(c, 100, y + 43, 17); c.fillStyle = '#2ecc71'; c.fill(); c.restore();
      txt(c, name, 136, y + 38, { size: 28, weight: 800 });
      txt(c, det, 136, y + 68, { size: 18, weight: 600, color: C.muted, maxW: W - 460 });
      txt(c, 'Completada', W - 84, y + 52, { size: 26, weight: 900, color: '#2ecc71', align: 'right' });
    });
    txt(c, '“Nadie lo ve. Pero también es entrenamiento.”', W / 2, H - 42, { size: 27, weight: 600, color: C.orange, align: 'center', italic: true });
  }, { parent: scr, pos: [0, 1.9, -2.85] });
  const b1 = button('JUGAR DE NUEVO', { parent: scr, pos: [-.6, .88, -2.8], w: 1.05, h: .22, onClick: () => startMatch() });
  const b2 = button('VOLVER AL INICIO', { parent: scr, pos: [.6, .88, -2.8], w: 1.05, h: .22, variant: 'secondary', onClick: () => goHome() });
  appear(panel, 0, 900); appear(b1, 500); appear(b2, 600);
  // partículas doradas suaves
  const n = 140, arr = new Float32Array(n * 3), d = [];
  for (let i = 0; i < n; i++) { d.push({ x: rand(-8, 8), y: rand(0, 6), z: rand(-10, 2), v: rand(.05, .2), a: rand(0, 6) }); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffe3a3, size: .06, map: dotTex, transparent: true, opacity: .8, depthWrite: false, blending: THREE.AdditiveBlending }));
  scr.object3D.add(pts);
  onTick((dt, t) => { d.forEach((p, i) => { p.y += p.v * dt; if (p.y > 7) p.y = 0; arr[i * 3] = p.x + Math.sin(t * .5 + p.a) * .3; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z; }); geo.attributes.position.needsUpdate = true; }, scr);
}
async function goHome() {
  await transition(() => { Sound.padStop(2); Sound.crowdStop(1); setEnv('hub'); showWelcome(); }, { fadeMs: 800 });
}

/* ===================================================================
   ARRANQUE
   =================================================================== */
AFRAME.registerComponent('piki-game', {
  init() {
    this.time = 0;
    const go = () => boot(this.el).catch(e => console.error(e));
    if (this.el.hasLoaded) go(); else this.el.addEventListener('loaded', go, { once: true });
  },
  tick(t, dt) {
    if (!ENV.ready) return;
    updateTweens(Math.min(dt || 16, 500));
    dt = Math.min(dt || 16, 60); const s = dt / 1000; this.time += s;
    tickers.forEach(f => { try { f(s, this.time); } catch (e) { console.error(e); tickers.delete(f); } });
    if (G.env === 'hub') ENV.hub.update(s, this.time);
    if (G.env === 'stadium') ENV.stadium.update(s, this.time);
  },
});

async function boot(scn) {
  sceneEl = scn; scene3 = scn.object3D; camEl = $('#cam'); rigEl = $('#rig'); uiRoot = $('#ui');
  try { await Promise.race([Promise.all([document.fonts.load('900 40px Montserrat'), document.fonts.load('600 40px Montserrat'), document.fonts.load('italic 600 40px Montserrat')]), wait(3000)]); } catch (e) { }
  buildSky(); buildLights(); buildHub(); buildStadium(); buildLocker();
  // esfera de fundido y cartel de transición (pegados a la cámara)
  fadeMesh = new THREE.Mesh(new THREE.SphereGeometry(.4, 24, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 1, side: THREE.BackSide, depthTest: false, depthWrite: false, fog: false }));
  fadeMesh.renderOrder = 10000; camEl.object3D.add(fadeMesh);
  const cardHolder = document.createElement('a-entity'); camEl.appendChild(cardHolder);
  cardEl = canvasPlane(1.5, .56, drawCard, { parent: cardHolder, pos: [0, 0, -1.1], order: 10001, depthTest: false, ppm: 700, state: {} });
  cardEl.object3D.visible = false;

  // Controles de entrada
  const setGaze = on => { const g = $('#gaze'); g.setAttribute('raycaster', 'enabled', on); g.setAttribute('visible', on); };
  sceneEl.addEventListener('enter-vr', () => { $('#hud').style.display = 'none'; const dev = AFRAME.utils.device; if (dev.isMobile() && !dev.isMobileVR()) setGaze(true); });
  sceneEl.addEventListener('exit-vr', () => { $('#hud').style.display = ''; setGaze(false); });
  ['#handL', '#handR'].forEach(id => {
    const h = $(id);
    h.addEventListener('controllerconnected', () => setGaze(false));
    h.addEventListener('triggerdown', () => setHold(true)); h.addEventListener('triggerup', () => setHold(false));
    h.addEventListener('gripdown', () => setHold(true)); h.addEventListener('gripup', () => setHold(false));
  });
  window.addEventListener('mousedown', e => { if (e.button === 0) setHold(true); });
  window.addEventListener('mouseup', () => setHold(false));
  window.addEventListener('touchstart', () => setHold(true), { passive: true });
  window.addEventListener('touchend', () => setHold(false));
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) setHold(true); }
    if (e.key === 'm' || e.key === 'M') toggleMute();
    if (e.key === 'r' || e.key === 'R') recenter();
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') setHold(false); });
  const toggleMute = () => { Sound.setMuted(!Sound.isMuted()); $('#btnMute').textContent = Sound.isMuted() ? '🔇 Silencio' : '🔊 Sonido'; };
  const recenter = () => { if (!stage) return; const { yaw, pos } = camWorld(); stage.object3D.rotation.y = yaw; stage.object3D.position.x = pos.x; stage.object3D.position.z = pos.z; };
  $('#btnMute').addEventListener('click', e => { e.stopPropagation(); Sound.init(); toggleMute(); });
  $('#btnRecenter').addEventListener('click', e => { e.stopPropagation(); recenter(); });
  ['mousedown', 'touchstart'].forEach(ev => $('#controls').addEventListener(ev, e => e.stopPropagation()));
  document.addEventListener('pointerdown', () => Sound.init(), { once: true });

  ENV.ready = true;
  // Arranque (con atajo de pruebas ?etapa=...)
  const q = new URLSearchParams(location.search).get('etapa');
  G.match = newMatch();
  if (q === 'cancha') { setEnv('stadium', 'match'); makeStage(); showArrival(); }
  else if (q === 'fisica') { setEnv('stadium', 'match'); makeStage(); showPhysIntro(); }
  else if (q === 'situacion') { setEnv('stadium', 'match'); makeStage(); G.phys = { sits: genSituations(G.match), idx: 0 }; showSituation(0); }
  else if (q === 'nutricion') { setEnv('locker'); makeStage(); showNutriIntro(); }
  else if (q === 'minijuego') { setEnv('locker'); makeStage(); runNutritionGame(); }
  else if (q === 'calma') { setEnv('stadium', 'calm'); makeStage(); showCalmIntro(); }
  else if (q === 'respiracion') { setEnv('stadium', 'calm'); makeStage(); runBreathing(); }
  else if (q === 'final') { G.phys = { sits: genSituations(G.match), firstTry: 2 }; G.nutri = { score: 82, stars: 2, good: 19 }; G.calm = { cycles: 6, guided: false, sync: 86, hr: 64 }; setEnv('stadium', 'dawn'); ENV.stadium.mode('done'); makeStage(); showFinal(); }
  else if (q === 'deporte') { setEnv('hub'); makeStage(); showSport(); }
  else { setEnv('hub'); showWelcome(); }
  $('#loader').style.opacity = 0; setTimeout(() => $('#loader').remove(), 900);
  fade(0, 1200);
}
})();
