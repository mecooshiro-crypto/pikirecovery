<style>
  :root { --teal:#22f0bf; --lima:#b9d339; --petroleo:#004856; --bg:#04131f; --text:#eaf2fb; --muted:#9fb3c8; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; font-family:Poppins, system-ui, sans-serif; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #brand { position:absolute; top:14px; left:16px; display:flex; align-items:center; gap:10px; color:var(--text);
           font-weight:800; letter-spacing:.08em; font-size:13px; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  #brand .dot { width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #7dffd9, var(--teal) 55%, #0a7f66);
                display:grid; place-items:center; color:#04131f; font-weight:900; font-size:14px; box-shadow:0 0 14px rgba(34,240,191,.6); }
  #brand .iso { height:24px; filter: drop-shadow(0 1px 4px rgba(0,0,0,.6)); }
  #brand > div { color: var(--lima); }
  #brand small { display:block; font-weight:600; letter-spacing:.04em; color:var(--muted); font-size:11px; }
  #hint { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); max-width:min(92vw,720px); text-align:center;
          color:var(--text); font-size:13px; font-weight:600; background:rgba(5,11,22,.66); border:1px solid rgba(255,255,255,.14);
          padding:9px 16px; border-radius:999px; backdrop-filter:blur(6px); transition:opacity .4s; }
  #controls { position:absolute; top:12px; right:14px; display:flex; gap:8px; pointer-events:auto; }
  #controls button { background:rgba(5,11,22,.7); color:var(--text); border:1px solid rgba(255,255,255,.2); border-radius:999px;
          font:700 12px Poppins, sans-serif; padding:8px 13px; cursor:pointer; }
  #controls button:hover { border-color:var(--teal); }
  #loader { position:fixed; inset:0; z-index:20; background:radial-gradient(ellipse at center, #0b1d33 0%, #050b16 70%);
            display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text); gap:18px; transition:opacity .8s; }
  #loader .ring { width:54px; height:54px; border-radius:50%; border:4px solid rgba(34,240,191,.2); border-top-color:var(--teal); animation:spin 1s linear infinite; }

  #loader p { margin:0; color:var(--muted); font-size:13px; }

<div id="loader"><img src="assets/marca/piki-isologo-blanco.svg" alt="Piki" style="height:64px"><div class="ring"></div><h1>PIKI GAME</h1><p>Recuperar también es entrenar · Preparando el estadio…</p></div>
<div id="hud">
  <div id="brand"><img class="iso" src="assets/marca/piki-isotipo-blanco.svg" alt=""><div>PIKI GAME<small>Fútbol · Recuperar también es entrenar.</small></div></div>

<a-scene id="scene"
  renderer="antialias: true; colorManagement: true; maxCanvasWidth: 2048; maxCanvasHeight: 2048; foveationLevel: 0.5"
  light="defaultLightsEnabled: false"
  loading-screen="enabled: false"
  vr-mode-ui="enabled: true"
  device-orientation-permission-ui="enabled: true"
  webxr="optionalFeatures: local-floor, bounded-floor"
  cursor="rayOrigin: mouse; fuse: false"
  raycaster="objects: .clickable; far: 40"
  piki-game>
  <a-entity id="rig" position="0 0 0">
    <a-entity id="cam" camera="fov: 75; near: 0.05; far: 900" position="0 1.6 0"
              look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true"
              wasd-controls="enabled: false">
      <a-entity id="gaze" visible="false" position="0 0 -0.9"
                cursor="fuse: true; fuseTimeout: 1300; rayOrigin: entity"
                raycaster="objects: .clickable; far: 40; enabled: false"
                geometry="primitive: ring; radiusInner: 0.011; radiusOuter: 0.019"
                material="shader: flat; color: #22f0bf; opacity: 0.95; transparent: true; depthTest: false"
                animation__fuse="property: scale; startEvents: fusing; easing: linear; dur: 1300; from: 1.8 1.8 1.8; to: 0.55 0.55 0.55"
                animation__reset="property: scale; startEvents: mouseleave, click; dur: 150; to: 1 1 1"></a-entity>
    </a-entity>
    <a-entity id="handL" laser-controls="hand: left" raycaster="objects: .clickable; far: 40; lineColor: #22f0bf; lineOpacity: 0.7"></a-entity>
    <a-entity id="handR" laser-controls="hand: right" raycaster="objects: .clickable; far: 40; lineColor: #22f0bf; lineOpacity: 0.7"></a-entity>
  </a-entity>
  <a-entity id="ui"></a-entity>
</a-scene>

<script>
(() => {
'use strict';
/* =====================================================================
   PIKI GAME · FÚTBOL — Experiencia VR / 360° (marca Piki)
   Recorrido: Inicio → Elección de deporte → Cancha (final del partido)
   → Etapa 1 Recuperación física → Etapa 2 Recuperación nutricional
   → Etapa 3 Vuelta a la calma → Recuperación completada
   ===================================================================== */
const THREE = AFRAME.THREE;
const $ = s => document.querySelector(s);

/* ----------------------------- Utilidades ----------------------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmt1 = v => v.toFixed(1).replace('.', ',');
const ease = {
  inOut: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  lin: t => t,
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
const wait = ms => new Promise(r => setTimeout(r, ms));

/* Motor de tweens y "tickers" (funciona dentro y fuera de VR porque lo mueve el tick de A-Frame) */
const tweens = [];
function tween(ms, fn, easing = ease.inOut) {
  return new Promise(res => tweens.push({ t: 0, d: Math.max(1, ms), fn, easing, res }));
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt;
    const k = Math.min(1, tw.t / tw.d);
    try { tw.fn(tw.easing(k)); } catch (e) { console.error(e); }
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}
const tickers = new Set();

/* ------------------------------ Paleta ------------------------------ */

  teal: '#22f0bf', lima: '#b9d339', petroleo: '#004856', cyan: '#4fd1e6', orange: '#ff8a3d', yellow: '#ffd93d', red: '#ff4d5e',

};

function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);

}

    mesh, cur: SKY.hub,
    draw(p) {

      const g = c.createLinearGradient(0, 0, 0, 512);
      g.addColorStop(0, p.zen); g.addColorStop(.32, p.mid); g.addColorStop(.5, p.hor); g.addColorStop(.53, p.gnd); g.addColorStop(1, p.gnd);

        rg.addColorStop(0, `rgba(255,236,190,${.85 * p.sun})`); rg.addColorStop(.15, `rgba(255,190,120,${.45 * p.sun})`); rg.addColorStop(1, 'rgba(255,160,90,0)');

/* efectos de aplicación sobre la zona */
function treatmentFX(body, kind, noPack = false) {
  const holder = new THREE.Group(); body.markerG.add(holder);
  const color = kind === 'frio' ? 0x7fd8ff : kind === 'calor' ? 0xff8a3d : 0x3ddc97;
  const n = 46, pos = new Float32Array(n * 3), data = [];
  for (let i = 0; i < n; i++) data.push({ x: rand(-.2, .2), y: rand(-.2, .3), z: rand(-.2, .2), v: rand(.1, .35), a: rand(0, 6) });
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size: kind === 'frio' ? .03 : .025, map: dotTex, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending }));
  pts.renderOrder = 32; holder.add(pts);
  let pack = null; const rings = [];
  if ((kind === 'frio' || kind === 'calor') && !noPack) {
    pack = new THREE.Mesh(new THREE.BoxGeometry(.2, .14, .05), new THREE.MeshStandardMaterial({ color: kind === 'frio' ? 0xbfefff : 0xff9b5a, emissive: kind === 'frio' ? 0x1a6a8a : 0x8a2a00, transparent: true, opacity: .85, depthTest: false }));
    pack.renderOrder = 33; pack.position.set(0, 0, .45); holder.add(pack);
  } else {
    for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(.08, .008, 6, 40), new THREE.MeshBasicMaterial({ color, transparent: true, depthTest: false })); r.renderOrder = 33; holder.add(r); rings.push(r); }
  }
  const glow = glowSprite(color, .2, .8); glow.material.depthTest = false; glow.renderOrder = 28; holder.add(glow);
  let t = 0;
  const step = dt => {
    t += dt;
    data.forEach((d, i) => {
      if (kind === 'frio') { d.y -= d.v * dt * .6; if (d.y < -.25) d.y = .3; pos[i * 3] = d.x + Math.sin(t * 2 + d.a) * .03; pos[i * 3 + 1] = d.y; pos[i * 3 + 2] = d.z; }
      else if (kind === 'calor') { d.y += d.v * dt; if (d.y > .45) d.y = -.1; pos[i * 3] = d.x * (1 - d.y); pos[i * 3 + 1] = d.y; pos[i * 3 + 2] = d.z * (1 - d.y); }
      else { const a = d.a + t * 2.2; const r = .12 + ((t * .5 + i / n) % 1) * .22; pos[i * 3] = Math.cos(a) * r; pos[i * 3 + 1] = d.y * .4; pos[i * 3 + 2] = Math.sin(a) * r; }
    });
    geo.attributes.position.needsUpdate = true;
    if (pack) pack.position.z = lerp(pack.position.z, .1, 1 - Math.exp(-dt * 3));
    rings.forEach((r, i) => { const k = (t * .9 + i / 3) % 1; r.scale.setScalar(1 + k * 3); r.material.opacity = 1 - k; const wp = new THREE.Vector3(); camEl.object3D.getWorldPosition(wp); r.lookAt(wp); });
    glow.scale.setScalar(.25 + Math.sin(t * 3) * .05 + Math.min(t, 3) * .08);
  };
  return { step, holder, dispose() { body.markerG.remove(holder); disposeObj(holder); } };
}

const plural = z => z.art.startsWith('los ');

const vb = (z, s, p) => plural(z) ? p : s;
function makeSituation(key, type, m) {
  const z = ZONES[key]; const side = z.lado ? pick(['derecha', 'izquierda']) : null;
  const intensity = type === 'dolor' ? pick(['moderada', 'alta']) : type === 'rigidez' ? pick(['leve', 'moderada']) : pick(['leve', 'moderada', 'alta']);
  const level = { leve: randi(2, 3), moderada: randi(4, 6), alta: randi(7, 8) }[intensity];
  const min = randi(52, 88); const lado = side ? (key === 'trapecio' ? ` del lado ${side}` : ` de la pierna ${side}`) : '';
  let correct, text, signals;
  if (type === 'dolor') {
    correct = 'frio';
    text = `Minuto ${min}: recibiste ${z.golpe}. Ahora la zona está hinchada, caliente y duele al tocarla.`;
    signals = ['Golpe reciente', 'Hinchazón', 'Calor en la zona'];
  } else if (type === 'molestia') {
    if (intensity === 'alta') { correct = 'frio'; text = `En un sprint del minuto ${min} sentiste un pinchazo en ${z.art}${lado}. Se nota una leve hinchazón y molesta al apoyar.`; signals = ['Pinchazo', 'Hinchazón leve', 'Aparición reciente']; }
    else { correct = 'masaje'; text = `Los cambios de ritmo y los arranques cargaron ${z.art}. Sentís tensión al estirar, pero no hubo golpe ni hay hinchazón.`; signals = ['Sobrecarga', 'Sin golpe', 'Sin hinchazón']; }
  } else if (type === 'fatiga') {

    signals = ['Cansancio muscular', 'Pesadez', 'Sin dolor puntual'];
  } else {
    correct = 'calor';
    text = `${cap(z.art)} ${vb(z, 'está', 'están')} ${agr(z, 'duro')} y cuesta moverl${plural(z) ? 'os' : fem(z) ? 'a' : 'o'}. ${vb(z, 'Se endureció', 'Se endurecieron')} al enfriarte después del partido. No hubo golpe ni hinchazón.`;
    signals = ['Poca movilidad', 'Tensión', 'Sin inflamación'];
  }

}
function genSituations(m) {
  for (let tries = 0; tries < 80; tries++) {
    const keys = shuffle(Object.keys(ZONES)).slice(0, 3);
    const sits = keys.map(k => makeSituation(k, pick(ZONES[k].types), m));
    const answers = new Set(sits.map(s => s.correct)); const types = new Set(sits.map(s => s.type));
    if (answers.size >= 2 && types.size >= 2) return sits;
  }
  return ['cuadri', 'isquio', 'lumbar'].map((k, i) => makeSituation(k, ['dolor', 'fatiga', 'rigidez'][i], m));
}

function floatText(parent, pos, text, color) {
  const el = canvasPlane(1.6, .26, (c, W, H) => {
    c.lineWidth = 8; c.strokeStyle = 'rgba(5,11,22,.9)'; setFont(c, 44, 900); c.textAlign = 'center'; c.strokeText(text, W / 2, H * .7, W - 20);

  }, { parent, pos: [pos.x, pos.y + .15, pos.z], order: 40, ppm: 260 });
  el.object3D.rotation.set(0, Math.atan2(-pos.x, -pos.z), 0);
  const y0 = el.object3D.position.y;
  tween(1300, k => { el.object3D.position.y = y0 + k * .45; el.ui.mat.opacity = k < .6 ? 1 : 1 - (k - .6) / .4; }, ease.out).then(() => removeEl(el));

function burst(parent, pos, color) {
  const n = 22, arr = new Float32Array(n * 3), vel = [];
  for (let i = 0; i < n; i++) { arr[i * 3] = pos.x; arr[i * 3 + 1] = pos.y; arr[i * 3 + 2] = pos.z; vel.push(new THREE.Vector3(rand(-1, 1), rand(-.4, 1.4), rand(-1, 1)).multiplyScalar(1.6)); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size: .07, map: dotTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  parent.object3D.add(pts); let t = 0;
  const f = dt => {
    t += dt; for (let i = 0; i < n; i++) { vel[i].y -= 3 * dt; arr[i * 3] += vel[i].x * dt; arr[i * 3 + 1] += vel[i].y * dt; arr[i * 3 + 2] += vel[i].z * dt; }
    geo.attributes.position.needsUpdate = true; pts.material.opacity = 1 - t / .8;
    if (t > .8) { tickers.delete(f); parent.object3D.remove(pts); geo.dispose(); pts.material.dispose(); }
  };
  tickers.add(f);
}

  let yUser = -YR, T = -3, hr = 104, shake = 0, agit = 0, samples = 0, onPath = 0, phase = '', failed = false, infoT = 0, ended = false;
  const plane = new THREE.Plane(), nrm = new THREE.Vector3(), wpos = new THREE.Vector3(), hit = new THREE.Vector3(), wq = new THREE.Quaternion();

/* ---------- 7. El próximo partido · rendimiento según tu recuperación ---------- */
function ensureSampleResults() {
  if (!G.phys || !G.phys.sits) { const sits = genSituations(G.match || newMatch()); sits.forEach(s => { s.attempts = 1; s.firstTry = true; }); sits[2].attempts = 2; sits[2].firstTry = false; G.phys = { sits, firstTry: 2 }; }
  if (!G.nutri) G.nutri = { score: 78, stars: 2, good: 18 };
  if (!G.calm) G.calm = { cycles: 3, failed: false, sync: 80, hr: 66 };
}
function perfScores() {
  const P = G.phys, N = G.nutri, K = G.calm;
  const phys = P && P.sits && P.sits.length ? P.sits.reduce((a, s) => a + (s.attempts <= 1 ? 100 : s.attempts === 2 ? 60 : 30), 0) / P.sits.length : 50;
  const nutri = N ? N.score : 50, calm = !K ? 50 : K.failed ? K.sync * .35 : Math.min(100, K.sync * 1.05);
  return { phys, nutri, calm, failed: !!(K && K.failed), total: Math.round(clamp(phys * .35 + nutri * .35 + calm * .3, 0, 100)) };
}
const subMinute = p => p >= 75 ? 90 : p >= 55 ? 75 : p >= 35 ? 60 : p >= 20 ? 45 : 30;
function outcome(p) {
  if (p >= 90) return 'Jugaste los 90 minutos rindiendo al 100%';
  if (p >= 75) return 'Jugaste los 90 minutos a buen nivel';
  if (p >= 55) return 'Te cambiaron al minuto 75: se notó el cansancio';
  if (p >= 35) return 'Saliste al minuto 60 con molestias musculares';
  if (p >= 20) return 'El DT te sacó en el entretiempo';
  return 'El DT te cambió al minuto 30 por bajo rendimiento';
}

    { card: { kicker: 'UNA SEMANA DESPUÉS', title: 'Tu próximo partido', sub: 'Así se nota en la cancha todo el trabajo invisible', color: C.teal }, hold: 2000 });

}

  { k: 'calmPace', cat: 'COGNITIVA', c: C.yellow, n: 'Ritmo tranquilo', d: 'Más tiempo en el minijuego, barras que bajan más lento y un camino de respiración más ancho.' },
];
function drawAccessRow(c, W, H, s) {
  const o = s.o, on = o.value ? Access.get('music') !== 0 : !!Access.get(o.k), hc = Access.get('highContrast');
  rr(c, 2, 2, W - 4, H - 4, 16); c.fillStyle = on ? '#1d5751' : hc ? '#001418' : '#084654'; c.fill();
  c.lineWidth = 3; c.strokeStyle = s.hover ? '#ffffff' : on ? hexA(C.lima, .85) : hc ? 'rgba(255,255,255,.6)' : 'rgba(255,255,255,.12)'; c.stroke();
  txt(c, o.cat, 22, 25, { size: 13, weight: 800, color: o.c, ls: 2 });
  txt(c, o.n, 22, 50, { size: 22, weight: 800 });
  wrap(c, o.d, 330, 28, W - 330 - 170, 20, { size: 16, weight: 600, color: C.muted });
  const state = o.value ? Access.musicName() : on ? 'SÍ' : 'NO';
  setFont(c, 18, 800); const pw = Math.max(96, c.measureText(state).width + 36), px = W - 18 - pw;
  rr(c, px, 13, pw, 36, 18);
  if (on) { c.fillStyle = C.lima; c.fill(); } else if (o.value) { c.fillStyle = 'rgba(255,255,255,.14)'; c.fill(); } else { c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.45)'; c.stroke(); }
  txt(c, state, px + pw / 2, 38, { size: 18, weight: 800, color: on ? '#04131f' : C.text, align: 'center' });
}
function showAccess(animate = true) {
  makeScreen();
  setHint('Accesibilidad · Tocá cada opción para activarla o desactivarla');
  const panel = canvasPlane(2.7, 1.78, (c, W, H) => {
    panelBg(c, W, H, C.lima);
    txt(c, 'PIKI GAME · ACCESIBILIDAD', 56, 64, { size: 19, weight: 800, color: C.lima, ls: 4 });
    txt(c, 'Jugá a tu manera', 56, 124, { size: 48, weight: 900 });
    txt(c, 'Las opciones quedan guardadas en este navegador para las próximas partidas.', 56, 162, { size: 21, weight: 600, color: C.muted });
    txt(c, 'Siempre: se juega con un solo botón o con la mirada · la interfaz se acomoda si jugás sentado · cada sonido tiene su señal visual', W / 2, H - 22, { size: 15, weight: 600, color: C.muted, align: 'center', maxW: W - 80 });
  }, { parent: screen, pos: [0, 1.84, -2.75] });
  const K = panel.bigK || 1, PPM = 400, PW = 1080, PH = 712, rw = 968, rh = 62, gap = 6, y0 = 182;
  ACCESS_OPTS.forEach((o, i) => {
    const y = y0 + i * (rh + gap), cy = (PH / 2 - (y + rh / 2)) / PPM;
    const row = button(o.n, { parent: panel, pos: [0, cy * K, .006], w: rw / PPM, h: rh / PPM, draw: drawAccessRow, state: { o }, big: false,
      onClick: () => { if (o.value) Access.set('music', (Access.get('music') + 1) % 4); else Access.toggle(o.k); showAccess(false); } });
    row.ui.mesh.scale.setScalar(K); row.ui.mesh.renderOrder = 21;
  });
  const bOk = button('Listo', { parent: screen, pos: [-.5, .8, -2.72], w: .9, h: .22, onClick: () => showWelcome() });
  const bReset = button('Restablecer', { parent: screen, pos: [.5, .8, -2.72], w: .9, h: .22, variant: 'secondary', onClick: () => { Access.reset(); showAccess(false); } });
  if (animate) { appear(panel); appear(bOk, 200); appear(bReset, 250); }
}
async function goHome() {
  await transition(() => { Sound.padStop(2); Sound.crowdStop(1); setEnv('hub'); showWelcome(); }, { fadeMs: 800 });
}

/* ===================================================================
   ARRANQUE
   =================================================================== */
AFRAME.registerComponent('piki-game', {
  init() {
    this.time = 0;
    const go = () => boot(this.el).catch(e => console.error(e));
    if (this.el.hasLoaded) go(); else this.el.addEventListener('loaded', go, { once: true });
  },
  tick(t, dt) {
    if (!ENV.ready) return;
    updateTweens(Math.min(dt || 16, 500));
    dt = Math.min(dt || 16, 60); const s = dt / 1000; this.time += s;
    tickers.forEach(f => { try { f(s, this.time); } catch (e) { console.error(e); tickers.delete(f); } });
    try { dragTick(s, this.time); shakeTick(this.time); } catch (e) { console.error(e); }
    if (G.env === 'hub') ENV.hub.update(s, this.time);
    if (G.env === 'stadium') ENV.stadium.update(s, this.time);
  },
});

async function boot(scn) {
  sceneEl = scn; scene3 = scn.object3D; camEl = $('#cam'); rigEl = $('#rig'); uiRoot = $('#ui');
  try { await Promise.race([Promise.all([document.fonts.load('900 40px Poppins'), document.fonts.load('600 40px Poppins'), document.fonts.load('italic 800 40px Poppins'), document.fonts.load('italic 500 40px Poppins'), preloadLogos()]), wait(4000)]); } catch (e) { }
  buildSky(); buildLights(); buildHub(); buildStadium(); buildLocker();
  // esfera de fundido y cartel de transición (pegados a la cámara)
  fadeMesh = new THREE.Mesh(new THREE.SphereGeometry(.4, 24, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 1, side: THREE.BackSide, depthTest: false, depthWrite: false, fog: false }));
  fadeMesh.renderOrder = 10000; camEl.object3D.add(fadeMesh);
  const cardHolder = document.createElement('a-entity'); camEl.appendChild(cardHolder);
  cardEl = canvasPlane(1.5, .56, drawCard, { parent: cardHolder, pos: [0, 0, -1.1], order: 10001, depthTest: false, ppm: 700, state: {} });
  cardEl.object3D.visible = false;

  // Controles de entrada
  const setGaze = on => { const g = $('#gaze'); g.setAttribute('raycaster', 'enabled', on); g.setAttribute('visible', on); };
  // Barra de instrucciones y subtítulos frente a la vista (solo en VR)
  vrBar = canvasPlane(1.4, .3, drawVrBar, { parent: cardHolder, pos: [0, -.36, -1.25], order: 10002, depthTest: false, ppm: 500, state: { hint: hintNow, cap: '' }, big: false });
  vrBar.object3D.visible = false;
  sceneEl.addEventListener('enter-vr', () => { vrBar.object3D.visible = true; });
  sceneEl.addEventListener('exit-vr', () => { vrBar.object3D.visible = false; });
  Access.apply();
  sceneEl.addEventListener('enter-vr', () => { $('#hud').style.display = 'none'; const dev = AFRAME.utils.device; if (dev.isMobile() && !dev.isMobileVR()) setGaze(true); });
  sceneEl.addEventListener('exit-vr', () => { $('#hud').style.display = ''; setGaze(false); });
  ['#handL', '#handR'].forEach(id => {
    const h = $(id);
    h.addEventListener('controllerconnected', () => { Ptr.ctrl[id] = true; setGaze(false); });
    h.addEventListener('controllerdisconnected', () => { Ptr.ctrl[id] = false; });
    h.addEventListener('triggerdown', ptrDown); h.addEventListener('triggerup', ptrUp);
    h.addEventListener('gripdown', ptrDown); h.addEventListener('gripup', ptrUp);
  });
  // Puntero: mouse y dedo (para arrastrar herramientas y seguir el camino de respiración)
  const setNdc = (x, y) => { const r = sceneEl.canvas.getBoundingClientRect(); Ptr.ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1); };
  window.addEventListener('pointermove', e => { if (e.isPrimary) setNdc(e.clientX, e.clientY); });
  window.addEventListener('pointerdown', e => { if (!e.isPrimary || e.button > 0) return; setNdc(e.clientX, e.clientY); ptrDown(); });
  window.addEventListener('pointerup', e => { if (e.isPrimary) ptrUp(); });
  window.addEventListener('pointercancel', e => { if (e.isPrimary) ptrUp(); });
  window.addEventListener('keydown', e => {
    if (e.key === 'm' || e.key === 'M') toggleMute();
    if (e.key === 'r' || e.key === 'R') recenter();
  });
  const toggleMute = () => { Sound.setMuted(!Sound.isMuted()); $('#btnMute').textContent = Sound.isMuted() ? '🔇 Silencio' : '🔊 Sonido'; };
  const recenter = () => { if (!stage) return; const { yaw, pos } = camWorld(); stage.object3D.rotation.y = yaw; stage.object3D.position.x = pos.x; stage.object3D.position.z = pos.z; };
  $('#btnMute').addEventListener('click', e => { e.stopPropagation(); Sound.init(); toggleMute(); });
  $('#btnRecenter').addEventListener('click', e => { e.stopPropagation(); recenter(); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(ev => $('#controls').addEventListener(ev, e => e.stopPropagation()));
  document.addEventListener('pointerdown', () => Sound.init(), { once: true });

  ENV.ready = true;
  // Arranque (con atajo de pruebas ?etapa=...)
  const q = new URLSearchParams(location.search).get('etapa');
  // ?debug: expone el estado para pruebas automáticas
  if (new URLSearchParams(location.search).has('debug')) window.__piki = { G, Drag, Ptr, Access, get body() { return body; }, get screen() { return screen; }, pointerRay, THREE, sceneEl };
  G.match = newMatch();
  if (q === 'cancha') { setEnv('stadium', 'match'); makeStage(); showArrival(); }
  else if (q === 'fisica') { setEnv('stadium', 'match'); makeStage(); showPhysIntro(); }
  else if (q === 'situacion') { setEnv('stadium', 'match'); makeStage(); G.phys = { sits: genSituations(G.match), idx: 0 }; showSituation(0); }
  else if (q === 'nutricion') { setEnv('locker'); makeStage(); showNutriIntro(); }
  else if (q === 'minijuego') { setEnv('locker'); makeStage(); runNutritionGame(); }
  else if (q === 'calma') { setEnv('stadium', 'calm'); makeStage(); showCalmIntro(); }
  else if (q === 'respiracion') { setEnv('stadium', 'calm'); makeStage(); runBreathing(); }
  else if (q === 'final') { G.phys = { sits: genSituations(G.match), firstTry: 2 }; G.nutri = { score: 82, stars: 2, good: 19 }; G.calm = { cycles: 3, failed: false, sync: 86, hr: 64 }; setEnv('stadium', 'dawn'); ENV.stadium.mode('done'); makeStage(); showFinal(); }
  else if (q === 'partido') { setEnv('stadium', 'next'); makeStage(); makeScreen(); nextMatch(); }
  else if (q === 'acceso') { setEnv('hub'); makeStage(); showAccess(); }
  else if (q === 'deporte') { setEnv('hub'); makeStage(); showSport(); }
  else { setEnv('hub'); showWelcome(); }
  $('#loader').style.opacity = 0; setTimeout(() => $('#loader').remove(), 900);
  fade(0, 1200);
}
})();
